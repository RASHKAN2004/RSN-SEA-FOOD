<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041d22" />
      <stop offset="50%" stop-color="#072d34" />
      <stop offset="100%" stop-color="#031518" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a38" />
      <stop offset="100%" stop-color="#ee4a08" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75d5cc" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ff7a38" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded pill/circle -->
  <rect width="64" height="64" rx="18" fill="url(#bg)" stroke="#1a5058" stroke-width="1.5" />

  <!-- Ocean Waves in Background -->
  <path d="M6 46C14 42 20 48 28 45C36 42 42 47 58 43" stroke="#164d57" stroke-width="2.5" stroke-linecap="round" />
  <path d="M8 52C16 49 22 54 32 51C40 48 48 53 56 50" stroke="#0e373e" stroke-width="2" stroke-linecap="round" />

  <!-- Stylized Jumping Fish / Seafood Emblem -->
  <g filter="url(#glow)">
    <!-- Fish Body Top Arc -->
    <path d="M12 28C17 21 28 17 40 22C46 25 50 30 52 34C48 33 43 31 38 31C28 31 18 35 12 40C13 36 12 32 12 28Z" fill="url(#coralGrad)" />
    
    <!-- Tail Fin -->
    <path d="M13 31C9 25 7 20 8 16C12 19 15 24 16 27Z" fill="url(#coralGrad)" />
    <path d="M13 34C9 38 6 43 8 47C12 44 14 39 16 35Z" fill="#e04306" />

    <!-- Sleek Dorsal / Fin Accents in Teal -->
    <path d="M26 18C30 14 36 15 39 18C35 18 30 19 26 21Z" fill="url(#tealGrad)" opacity="0.9" />
    <path d="M30 33C33 36 38 36 41 33C37 32 33 32 30 33Z" fill="url(#tealGrad)" />

    <!-- Eye Sparkle -->
    <circle cx="44" cy="26" r="2.2" fill="#ffffff" />
    <circle cx="44.6" cy="25.4" r="0.8" fill="#041d22" />
  </g>

  <!-- Freshness Sparkles -->
  <circle cx="49" cy="15" r="1.5" fill="#75d5cc" opacity="0.8" />
  <path d="M49 12V18M46 15H52" stroke="#75d5cc" stroke-width="0.8" stroke-linecap="round" opacity="0.8" />
</svg>
